[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "respike-core"
version = "0.1.0"
description = "Core projection reparameterization for ReSpike"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.1,<3"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["respike*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
